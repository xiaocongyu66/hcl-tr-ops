# 正式训练：约 33M 参数，语料为 Brahma + Neon 公开问答数据（约 1.5 亿 token）。
# 数据规模只够 ~4.5 token/参数，属于偏欠训练但可复现的真实训练。
model:
  vocab_size: 16384       # 在本次语料上训练（scripts/ingest_text.py）
  d_model: 448
  n_layer: 8              # 6 层 GDN-2 + 2 层全注意力（3:1）
  n_head: 7               # head_dim = 64
  attn_ratio: 4
  tie_embeddings: true
  use_qed: false
  use_sla: false
  qk_norm_full_attn: true
  gdn2_internal_qk_norm: false
  divide_by_sqrt_t: true
  output_gate: true
  output_gate_bias_init: 1.0
  gdn2_chunk: 512
  gdn2_chunk_backend: fused
  gdn2_fused_safe_exp: 80.0
  gdn2_matmul_dtype: fp32
  gdn2_loop_backend: triton

seed: 0

data:
  tokenizer: formal_bpe_16k
  vocab_size: 16384
  sources:
    en_brahma:
      kaggle: godelev/53m-token-instruction-code-and-qa-dataset
      weight: 0.35
    en_neon:
      kaggle: iipilix/neon-v4
      weight: 0.65
  edu_min_score: 0.0
  dedup_threshold: 0.0      # 问答集不重复度高，跳过 MinHash（省时）
  decontam_ngram: 13
  decontam_max_drop: 0.01
  data_mix_hash: null

optimizer:
  name: AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.1

grad_clip: 1.0

batch:
  micro_batch_per_gpu: 4
  seq_len: 4096
  grad_accum: 4           # 2 卡 × 4 × 4 × 4096 = 131072 global tokens
  n_gpu: 2
  global_batch_tokens: 131072

lr:
  sweep: [5e-4]
  schedule: token_level_cosine
  warmup_tokens: 2_000_000
  short_run_tokens: 150_000_000
  full_run_tokens: 150_000_000

train_tokens: 150_000_000
seq_len: 4096
log_every: 10
ckpt_every_tokens: 20_000_000

monitor:
  gdn2_gate_entropy_every_n_steps: 100
  gdn2_state_norm_every_n_steps: 500
  per_layer_grad_norm_every_n_steps: 100
  loss_spike_threshold: "3x running median"
  head_entropy_every_n_steps: 100
  head_entropy_collapse_threshold: 0.05
