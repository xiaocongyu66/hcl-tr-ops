# 小规模冒烟配置：用 Kaggle 切片数据跑通端到端训练（不用于正式训练）。
# 数据来自 scripts/ingest_text.py 产出的 uint16 分片。
model:
  vocab_size: 4000         # 切片词表（正式配置是自训 64k）
  d_model: 128
  n_layer: 4               # 3:1 GDN-2 + 全注意力
  n_head: 4                # head_dim = 32
  attn_ratio: 4
  tie_embeddings: true
  use_qed: false
  use_sla: false
  qk_norm_full_attn: true
  gdn2_internal_qk_norm: false
  divide_by_sqrt_t: true
  output_gate: true
  output_gate_bias_init: 1.0
  gdn2_chunk: 512
  gdn2_chunk_backend: fused
  gdn2_fused_safe_exp: 80.0
  gdn2_matmul_dtype: fp32

seed: 0

data:
  tokenizer: sample_bpe_4k
  vocab_size: 4000
  sources: {}
  edu_min_score: 0.0
  dedup_threshold: 0.8
  decontam_ngram: 13
  decontam_max_drop: 0.01
  data_mix_hash: null

optimizer:
  name: AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.1

grad_clip: 1.0

batch:
  micro_batch_per_gpu: 2
  seq_len: 256
  grad_accum: 1
  n_gpu: 1
  global_batch_tokens: 512

lr:
  sweep: [3e-4]
  schedule: token_level_cosine
  warmup_tokens: 1000
  short_run_tokens: 200000
  full_run_tokens: 200000

train_tokens: 200000
seq_len: 256

monitor:
  gdn2_gate_entropy_every_n_steps: 100
  gdn2_state_norm_every_n_steps: 500
  per_layer_grad_norm_every_n_steps: 100
  loss_spike_threshold: "3x running median"
  head_entropy_every_n_steps: 100
  head_entropy_collapse_threshold: 0.05
