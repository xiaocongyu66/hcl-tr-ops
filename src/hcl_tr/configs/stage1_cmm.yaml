# 阶段 1：CMM 中间训练（冻结骨干，只训 STM/LTM/读写头）
# 对应计划书 §4.4
seq_len: 8192
tokens: 1_000_000_000
lr: 1e-4
global_batch_tokens: 262144
T_max: 8
grad_checkpointing: true
input_hidden_layers: last_4_layers
data:
  cross_chunk_tasks_ratio: 0.30
  min_doc_len: 4096
unfreeze:
  backbone_lr: 1e-5
  tokens: 500_000_000
  rollback:
    condition: "S-NIAH-1 召回下降 >10%"
    action: "回退冻结版本"
